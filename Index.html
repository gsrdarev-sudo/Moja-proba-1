<!DOCTYPE html> <html lang="hr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Privatni Chat</title> <style> body { font-family: Arial, sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; } #header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; } #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; } .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 16px; word-wrap: break-word; } .mine { background: #dcf8c6; align-self: flex-end; } .theirs { background: white; align-self: flex-start; } .sender { font-size: 11px; color: #555; margin-bottom: 3px; font-weight: bold; } #input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; } input { flex: 1; padding: 12px; border: none; border-radius: 20px; font-size: 16px; outline: none; } button { background: #075e54; color: white; border: none; padding: 0 20px; border-radius: 20px; font-size: 16px; cursor: pointer; } </style> </head> <body> <div id="header">Naš Privatni Chat</div> <div id="messages"></div> <div id="input-area"> <input type="text" id="msgInput" placeholder="Napiši poruku..." autocomplete="off"> <button onclick="sendMessage()">Pošalji</button> </div> <script type="module"> import { initializeApp } from "https://gstatic.com"; import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com"; // OVDJE ZALIJEPI SVOJ LINK IZ FIREBASEA const firebaseConfig = { databaseURL: "https://console.firebase.google.com/project/moja-proba-1/database/moja-proba-1-default-rtdb/data/~2F?fb_gclid=CjwKCAiAtbvXBhB_EiwAjwv9JnQVsEEmKFrsjM1NicLG9CtTBASIISsp8saBLH3IWr6AaucbcO7iNBoCzXsQAvD_BwE&fb_utm_campaign=Cloud-SS-DR-Firebase-FY26-global-gsem-1713590&fb_utm_content=text-ad&fb_utm_medium=cpc&fb_utm_source=google&fb_utm_term=KW_google%20firebase%20console" }; const app = initializeApp(firebaseConfig); const db = getDatabase(app); const messagesRef = ref(db, 'poruke'); // Traži ime korisnika pri prvom otvaranju let username = localStorage.getItem('chat_username'); if (!username) { username = prompt("Unesi svoje ime:") || "Korisnik"; localStorage.setItem('chat_username', username); } const messagesDiv = document.getElementById('messages'); const msgInput = document.getElementById('msgInput'); // Funkcija za slanje poruke window.sendMessage = function() { const text = msgInput.value.trim(); if (text !== "") { push(messagesRef, { sender: username, text: text, timestamp: Date.now() }); msgInput.value = ""; } } // Slanje pritiskom na Enter msgInput.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); }); // Prikaz poruka u stvarnom vremenu onChildAdded(messagesRef, (snapshot) => { const data = snapshot.val(); const isMine = data.sender === username; const msgElement = document.createElement('div'); msgElement.className = `msg ${isMine ? 'mine' : 'theirs'}`; msgElement.innerHTML = `<div class="sender">${data.sender}</div>${data.text}`; messagesDiv.appendChild(msgElement); messagesDiv.scrollTop = messagesDiv.scrollHeight; }); </script> </body> </html>
