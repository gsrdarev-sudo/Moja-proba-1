<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naš Privatni Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }

    /* Zaglavlje */
    header {
      background: #075e54; color: white; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;
    }
    .header-info { flex: 1; min-width: 0; padding-right: 8px; }
    header h1 { font-size: 17px; margin-bottom: 2px; }
    #presence-status {
      font-size: 11px; color: #b2dfdb; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-small {
      background: #128c7e; color: white; border: none; padding: 6px 9px;
      border-radius: 5px; font-size: 11px; cursor: pointer;
    }
    .btn-danger { background: #c0392b; }

    /* Područje poruka */
    #chat-box {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg {
      max-width: 80%; padding: 8px 11px; border-radius: 10px;
      background: white; align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15); word-wrap: break-word;
    }
    .msg.mine { background: #dcf8c6; align-self: flex-end; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; }
    .msg-meta {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 4px; font-size: 10px; color: #777; margin-top: 4px;
    }
    .ticks { font-weight: bold; font-size: 11px; color: #888; }
    .ticks.read { color: #34b7f1; }

    .msg img { max-width: 100%; border-radius: 6px; margin-top: 4px; display: block; }
    .msg audio { max-width: 230px; height: 36px; margin-top: 4px; display: block; }
    .file-link {
      display: inline-block; margin-top: 4px; padding: 6px 10px;
      background: #f0f0f0; border-radius: 5px; color: #075e54;
      text-decoration: none; font-weight: bold; font-size: 13px;
    }

    /* Statusna traka */
    #status-bar {
      background: #fff3cd; color: #856404; text-align: center;
      font-size: 12px; padding: 5px; display: none; font-weight: bold;
    }

    /* Donja traka za unos */
    #input-area {
      background: #f0f0f0; padding: 8px; display: flex; gap: 6px; align-items: center;
    }
    .icon-btn {
      background: #128c7e; color: white; border: none; width: 38px; height: 38px;
      border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn.recording {
      background: #e74c3c; animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #msg-input {
      flex: 1; padding: 9px 13px; border: 1px solid #ccc;
      border-radius: 20px; font-size: 15px; outline: none; min-width: 0;
    }
    #send-btn {
      background: #075e54; color: white; border: none; padding: 9px 14px;
      border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>Naš Privatni Chat</h1>
      <div id="presence-status">Povezivanje...</div>
    </div>
    <div class="header-actions">
      <button class="btn-small" onclick="promijeniIme()">Ime</button>
      <button class="btn-small" onclick="promijeniLozinku()">Lozinka</button>
      <button class="btn-small btn-danger" onclick="obrisiRazgovor()">Obriši</button>
    </div>
  </header>

  <div id="status-bar"></div>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="posaljiDatoteku(event)">
    <button class="icon-btn" title="Pošalji sliku ili datoteku" onclick="document.getElementById('file-input').click()">📎</button>
    <button class="icon-btn" id="mic-btn" title="Snimi glasovnu poruku" onclick="snimiGlasovnu()">🎤</button>
    <input type="text" id="msg-input" placeholder="Napiši poruku..." oninput="obradiTipkanje()" onkeypress="if(event.key==='Enter') posaljiPoruku()">
    <button id="send-btn" onclick="posaljiPoruku()">Pošalji</button>
  </div>

    <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, push, set, update, remove,
      onChildAdded, onChildChanged, onValue, onDisconnect, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // =========================================================================
    // https://moja-proba-1-default-rtdb.europe-west1.firebasedatabase.app/
    // =========================================================================
    const firebaseConfig = {
  apiKey: "AIzaSyB6PdJOBWDygBpZU_70K7nMeOhZ5tkQpUA",
  authDomain: "moja-proba-1.firebaseapp.com",
  databaseURL: "https://moja-proba-1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "moja-proba-1",
  storageBucket: "moja-proba-1.firebasestorage.app",
  messagingSenderId: "52986959778",
  appId: "1:52986959778:web:33ebfaa1fde325f7c8c4fb"
};
    // =========================================================================

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Unos pristupne lozinke
    let lozinka = sessionStorage.getItem("chat_lozinka");
    if (!lozinka) {
      lozinka = prompt("Unesite pristupnu lozinku:");
      if (!lozinka || !lozinka.trim()) {
        alert("Pristup odbijen. Morate unijeti lozinku.");
        location.reload();
      }
      lozinka = lozinka.replace(/[.#$\[\]]/g, "");
      sessionStorage.setItem("chat_lozinka", lozinka);
    }

    // 2. Trajna identifikacija uređaja i imena
    let mojId = localStorage.getItem("chat_user_id");
    if (!mojId) {
      mojId = "u_" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem("chat_user_id", mojId);
    }

    let mojeIme = localStorage.getItem("chat_ime");
    if (!mojeIme || !mojeIme.trim()) {
      while (!mojeIme || !mojeIme.trim()) {
        mojeIme = prompt("Unesite svoje ime ili nadimak za ovaj uređaj:");
      }
      mojeIme = mojeIme.trim();
      localStorage.setItem("chat_ime", mojeIme);
    }

    // Putanje unutar odobrene sobe (ne mijenja Firebase Rules)
    const bazaSobe = "sobe/" + lozinka;
    const porukeRef = ref(db, bazaSobe + "/poruke");
    const prisutnostRef = ref(db, bazaSobe + "/prisutnost");
    const mojStatusRef = ref(db, bazaSobe + "/prisutnost/" + mojId);
    const connectedRef = ref(db, ".info/connected");

    const chatBox = document.getElementById("chat-box");
    const statusLabel = document.getElementById("presence-status");

    // 3. Praćenje Online / Offline statusa
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        onDisconnect(mojStatusRef).remove();
        set(mojStatusRef, {
          ime: mojeIme,
          online: true,
          tipka: false,
          zadnje: serverTimestamp()
        });
      }
    });

    // Prikaz tko je online i tko piše u zaglavlju
    onValue(prisutnostRef, (snap) => {
      const korisnici = snap.val() || {};
      const aktivni = [];
      const tipkaju = [];

      Object.keys(korisnici).forEach((id) => {
        if (id !== mojId && korisnici[id].online) {
          aktivni.push(korisnici[id].ime);
          if (korisnici[id].tipka) {
            tipkaju.push(korisnici[id].ime);
          }
        }
      });

      if (tipkaju.length > 0) {
        statusLabel.innerText = "✍️ " + tipkaju.join(", ") + " piše...";
        statusLabel.style.color = "#fff59d";
      } else if (aktivni.length > 0) {
        statusLabel.innerText = "🟢 Online: " + aktivni.join(", ");
        statusLabel.style.color = "#b2dfdb";
      } else {
        statusLabel.innerText = "⚪ Nitko drugi nije trenutno online";
        statusLabel.style.color = "#cfd8dc";
      }
    });

    // 4. Obavijest "piše..." pri tipkanju
    let tipkanjeTimer = null;
    window.obradiTipkanje = function() {
      update(mojStatusRef, { tipka: true });
      clearTimeout(tipkanjeTimer);
      tipkanjeTimer = setTimeout(() => {
        update(mojStatusRef, { tipka: false });
      }, 2000);
    };

    // 5. Prikaz poruka i označavanje pročitanog (✓ / ✓✓)
    function oznaciKaoProcitano(msgId, data) {
      if (data.posiljateljId !== mojId && !document.hidden) {
        if (!data.procitali || !data.procitali[mojId]) {
          update(ref(db, bazaSobe + "/poruke/" + msgId + "/procitali"), {
            [mojId]: mojeIme
          });
        }
      }
    }

    function generirajKvaciceHtml(data) {
      if (data.posiljateljId !== mojId) return "";
      const procitali = data.procitali ? Object.values(data.procitali) : [];
      if (procitali.length > 0) {
        return `<span class="ticks read" title="Pročitali: ${escapeHtml(procitali.join(', '))}">✓✓</span>`;
      }
      return `<span class="ticks">✓</span>`;
    }

    onChildAdded(porukeRef, (snapshot) => {
      const msgId = snapshot.key;
      const data = snapshot.val();
      const jeMoja = data.posiljateljId === mojId;

      const div = document.createElement("div");
      div.id = "msg-" + msgId;
      div.className = "msg" + (jeMoja ? " mine" : "");

      let sadrzaj = `<div class="msg-sender">${escapeHtml(data.ime)}</div>`;

      if (data.tekst) {
        sadrzaj += `<div>${escapeHtml(data.tekst)}</div>`;
      }
      if (data.slika) {
        sadrzaj += `<img src="${data.slika}" alt="Slika">`;
      }
      if (data.glasovna) {
        sadrzaj += `<audio controls src="${data.glasovna}"></audio>`;
      }
      if (data.datoteka && data.nazivDatoteke) {
        sadrzaj += `<a class="file-link" href="${data.datoteka}" download="${escapeHtml(data.nazivDatoteke)}">📄 ${escapeHtml(data.nazivDatoteke)}</a>`;
      }

      sadrzaj += `<div class="msg-meta"><span>${data.vrijeme || ""}</span><span class="tick-slot">${generirajKvaciceHtml(data)}</span></div>`;

      div.innerHTML = sadrzaj;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;

      oznaciKaoProcitano(msgId, data);
    });

    // Ažuriranje kvačica uživo kad netko pročita poruku
    onChildChanged(porukeRef, (snapshot) => {
      const msgId = snapshot.key;
      const data = snapshot.val();
      const msgDiv = document.getElementById("msg-" + msgId);
      if (msgDiv) {
        const tickSlot = msgDiv.querySelector(".tick-slot");
        if (tickSlot) tickSlot.innerHTML = generirajKvaciceHtml(data);
      }
    });

    // Kad korisnik ponovno otvori karticu/mobitel, označi nepročitane poruke
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        onValue(porukeRef, (snap) => {
          const sve = snap.val() || {};
          Object.keys(sve).forEach((id) => oznaciKaoProcitano(id, sve[id]));
        }, { onlyOnce: true });
      }
    });

    // 6. Slanje tekstualne poruke
    window.posaljiPoruku = function() {
      const input = document.getElementById("msg-input");
      const tekst = input.value.trim();
      if (!tekst) return;

      clearTimeout(tipkanjeTimer);
      update(mojStatusRef, { tipka: false });

      push(porukeRef, {
        posiljateljId: mojId,
        ime: mojeIme,
        tekst: tekst,
        vrijeme: trenutnoVrijeme()
      });

      input.value = "";
    };

    // 7. Snimanje i slanje glasovnih poruka (maks. 45 sekundi)
    let mediaRecorder = null;
    let audioChunks = [];
    let snimanjeAktivno = false;
    let snimanjeTimeout = null;

    window.snimiGlasovnu = async function() {
      const micBtn = document.getElementById("mic-btn");
      const statusBar = document.getElementById("status-bar");

      if (!snimanjeAktivno) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(track => track.stop());
            statusBar.innerText = "Slanje glasovne poruke...";
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.onload = function(e) {
              push(porukeRef, {
                posiljateljId: mojId,
                ime: mojeIme,
                glasovna: e.target.result,
                vrijeme: trenutnoVrijeme()
              }).then(() => { statusBar.style.display = "none"; });
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start();
          snimanjeAktivno = true;
          micBtn.classList.add("recording");
          micBtn.innerText = "⏹";
          statusBar.innerText = "🔴 Snimanje u tijeku... Kliknite ⏹ za slanje (maks. 45s)";
          statusBar.style.display = "block";

          snimanjeTimeout = setTimeout(() => {
            if (snimanjeAktivno) window.snimiGlasovnu();
          }, 45000);
        } catch (err) {
          alert("Nije moguć pristup mikrofonu. Provjerite dopuštenja u pregledniku.");
        }
      } else {
        clearTimeout(snimanjeTimeout);
        snimanjeAktivno = false;
        micBtn.classList.remove("recording");
        micBtn.innerText = "🎤";
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }
    };

    // 8. Slanje slika i datoteka
    window.posaljiDatoteku = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBar = document.getElementById("status-bar");
      statusBar.innerText = "Obrada i slanje datoteke...";
      statusBar.style.display = "block";

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement("canvas");
            const maxDim = 900;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);

            const komprimiranaSlika = canvas.toDataURL("image/jpeg", 0.75);
            push(porukeRef, {
              posiljateljId: mojId,
              ime: mojeIme,
              slika: komprimiranaSlika,
              vrijeme: trenutnoVrijeme()
            }).then(() => { statusBar.style.display = "none"; });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        if (file.size > 1.5 * 1024 * 1024) {
          alert("Datoteka je prevelika! Maksimalna veličina za dokumente je 1.5 MB.");
          statusBar.style.display = "none";
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          push(porukeRef, {
            posiljateljId: mojId,
            ime: mojeIme,
            datoteka: e.target.result,
            nazivDatoteke: file.name,
            vrijeme: trenutnoVrijeme()
          }).then(() => { statusBar.style.display = "none"; });
        };
        reader.readAsDataURL(file);
      }
      event.target.value = "";
    };

    // 9. Pomoćni gumbi (Lozinka, Ime, Brisanje)
    window.promijeniLozinku = function() {
      sessionStorage.removeItem("chat_lozinka");
      location.reload();
    };

    window.promijeniIme = function() {
      const novoIme = prompt("Unesite novo ime:", mojeIme);
      if (novoIme && novoIme.trim()) {
        mojeIme = novoIme.trim();
        localStorage.setItem("chat_ime", mojeIme);
        update(mojStatusRef, { ime: mojeIme });
      }
    };

    window.obrisiRazgovor = function() {
      if (confirm("Jeste li sigurni da želite trajno obrisati sve poruke u ovom razgovoru?")) {
        remove(porukeRef).then(() => { chatBox.innerHTML = ""; });
      }
    };

    function trenutnoVrijeme() {
      const sada = new Date();
      return sada.getHours().toString().padStart(2, "0") + ":" + sada.getMinutes().toString().padStart(2, "0");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
