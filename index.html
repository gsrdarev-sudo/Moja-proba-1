<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naš Privatni Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
    
    /* Zaglavlje */
    header {
      background: #075e54; color: white; padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 18px; }
    .header-actions { display: flex; gap: 8px; }
    .btn-small {
      background: #128c7e; color: white; border: none; padding: 6px 10px;
      border-radius: 5px; font-size: 12px; cursor: pointer;
    }
    .btn-danger { background: #c0392b; }

    /* Područje poruka */
    #chat-box {
      flex: 1; overflow-y: auto; padding: 15px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 78%; padding: 8px 12px; border-radius: 10px;
      background: white; align-self: flex-start;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15); word-wrap: break-word;
    }
    .msg.mine { background: #dcf8c6; align-self: flex-end; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 4px; }
    .msg-time { font-size: 10px; color: #777; text-align: right; margin-top: 4px; }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
    .file-link {
      display: inline-block; margin-top: 5px; padding: 6px 10px;
      background: #f0f0f0; border-radius: 5px; color: #075e54;
      text-decoration: none; font-weight: bold; font-size: 13px;
    }

    /* Donja traka za unos */
    #input-area {
      background: #f0f0f0; padding: 8px; display: flex; gap: 6px; align-items: center;
    }
    #file-btn {
      background: #128c7e; color: white; border: none; width: 40px; height: 40px;
      border-radius: 50%; font-size: 20px; cursor: pointer; flex-shrink: 0;
    }
    #msg-input {
      flex: 1; padding: 10px 14px; border: 1px solid #ccc;
      border-radius: 20px; font-size: 15px; outline: none;
    }
    #send-btn {
      background: #075e54; color: white; border: none; padding: 10px 16px;
      border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    #status-bar {
      background: #fff3cd; color: #856404; text-align: center;
      font-size: 12px; padding: 4px; display: none;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Naš Privatni Chat</h1>
      <small style="font-size: 11px; opacity: 0.85;">Zaštićeni razgovor</small>
    </div>
    <div class="header-actions">
      <button class="btn-small" onclick="promijeniIme()">Ime</button>
      <button class="btn-small" onclick="promijeniLozinku()">Lozinka</button>
      <button class="btn-small btn-danger" onclick="obrisiRazgovor()">Obriši sve</button>
    </div>
  </header>

  <div id="status-bar">Obrada i slanje datoteke...</div>
  <div id="chat-box"></div>

  <div id="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="posaljiDatoteku(event)">
    <button id="file-btn" title="Pošalji sliku ili datoteku" onclick="document.getElementById('file-input').click()">📎</button>
    <input type="text" id="msg-input" placeholder="Napiši poruku..." onkeypress="if(event.key==='Enter') posaljiPoruku()">
    <button id="send-btn" onclick="posaljiPoruku()">Pošalji</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, push, onChildAdded, remove } from "https://gstatic.com";

    // =========================================================================
    // https://moja-proba-1-default-rtdb.europe-west1.firebasedatabase.app/
    // =========================================================================
    const firebaseConfig = {
      apiKey: "TVOJ_API_KEY",
      authDomain: "TVOJ_://firebaseapp.com",
      databaseURL: "https://TVOJ_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "TVOJ_PROJEKT",
      storageBucket: "TVOJ_://appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };
    // =========================================================================

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Unos pristupne lozinke
    let lozinka = sessionStorage.getItem("chat_lozinka");
    if (!lozinka) {
      lozinka = prompt("Unesite pristupnu lozinku:");
      if (!lozinka || !lozinka.trim()) {
        alert("Pristup odbijen. Morate unijeti lozinku.");
        location.reload();
      }
      lozinka = lozinka.replace(/[.#$\[\]]/g, "");
      sessionStorage.setItem("chat_lozinka", lozinka);
    }

    // 2. Unos imena pošiljatelja
    let mojeIme = localStorage.getItem("chat_ime");
    if (!mojeIme) {
      mojeIme = prompt("Unesite svoje ime ili nadimak:") || "Gost";
      localStorage.setItem("chat_ime", mojeIme);
    }

    const kanalRef = ref(db, "sobe/" + lozinka);
    const chatBox = document.getElementById("chat-box");

    // Prikaz dolaznih poruka
    onChildAdded(kanalRef, (snapshot) => {
      const data = snapshot.val();
      const div = document.createElement("div");
      div.className = "msg" + (data.ime === mojeIme ? " mine" : "");

      let sadrzaj = `<div class="msg-sender">${escapeHtml(data.ime)}</div>`;
      
      if (data.tekst) {
        sadrzaj += `<div>${escapeHtml(data.tekst)}</div>`;
      }
      if (data.slika) {
        sadrzaj += `<img src="${data.slika}" alt="Slika">`;
      }
      if (data.datoteka && data.nazivDatoteke) {
        sadrzaj += `<a class="file-link" href="${data.datoteka}" download="${escapeHtml(data.nazivDatoteke)}">📄 Preuzmi: ${escapeHtml(data.nazivDatoteke)}</a>`;
      }
      sadrzaj += `<div class="msg-time">${data.vrijeme || ""}</div>`;

      div.innerHTML = sadrzaj;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Slanje tekstualne poruke
    window.posaljiPoruku = function() {
      const input = document.getElementById("msg-input");
      const tekst = input.value.trim();
      if (!tekst) return;

      push(kanalRef, {
        ime: mojeIme,
        tekst: tekst,
        vrijeme: trenutnoVrijeme()
      });
      input.value = "";
    };

    // Slanje slika i datoteka
    window.posaljiDatoteku = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("status-bar");
      status.style.display = "block";

      if (file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement("canvas");
            const maxDim = 900;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const komprimiranaSlika = canvas.toDataURL("image/jpeg", 0.75);

            push(kanalRef, {
              ime: mojeIme,
              slika: komprimiranaSlika,
              vrijeme: trenutnoVrijeme()
            }).then(() => { status.style.display = "none"; });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        if (file.size > 1.5 * 1024 * 1024) {
          alert("Datoteka je prevelika! Maksimalna veličina za dokumente je 1.5 MB.");
          status.style.display = "none";
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          push(kanalRef, {
            ime: mojeIme,
            datoteka: e.target.result,
            nazivDatoteke: file.name,
            vrijeme: trenutnoVrijeme()
          }).then(() => { status.style.display = "none"; });
        };
        reader.readAsDataURL(file);
      }
      event.target.value = "";
    };

    // Ponovni unos lozinke
    window.promijeniLozinku = function() {
      sessionStorage.removeItem("chat_lozinka");
      location.reload();
    };

    // Promjena imena
    window.promijeniIme = function() {
      const novoIme = prompt("Unesite novo ime:", mojeIme);
      if (novoIme && novoIme.trim()) {
        mojeIme = novoIme.trim();
        localStorage.setItem("chat_ime", mojeIme);
      }
    };

    // Brisanje svih poruka
    window.obrisiRazgovor = function() {
      if (confirm("Jeste li sigurni da želite trajno obrisati sve poruke?")) {
        remove(kanalRef).then(() => { chatBox.innerHTML = ""; });
      }
    };

    function trenutnoVrijeme() {
      const sada = new Date();
      return sada.getHours().toString().padStart(2, "0") + ":" + sada.getMinutes().toString().padStart(2, "0");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
